name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e './services/agent-api[test]'
      - run: pytest services/agent-api/tests
      - run: docker build -t mia-assistant:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.33.1
        with: { image-ref: "mia-assistant:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1" }
