guides:
- screenId: letter-of-credit-issue
  operation: letter-of-credit.issue.edit
  topic: Phát hành thư tín dụng
  steps:
  - Upload file PO để MIA bóc tách dữ liệu.
  - Bổ sung các trường Thông tin L/C còn thiếu.
  - Submit yêu cầu cho checker và chờ MSB xử lý hồ sơ.
- screenId: domestic-disbursement-create
  operation: disbursement.domestic.edit
  topic: Tạo yêu cầu giải ngân
  steps:
  - Chọn mục đích thanh toán và loại chuyển tiền.
  - Nhập thông tin người thụ hưởng, số tiền và nội dung.
  - Kiểm tra thông tin trước khi chọn Tiếp tục.
- screenId: disbursement-dashboard
  operation: disbursement.dashboard.view
  topic: Quản lý giải ngân
  steps:
  - Xem hạn mức và danh sách yêu cầu giải ngân.
  - Chọn mục đích thanh toán để mở màn hình tạo yêu cầu.
- screenId: single-transfer-create
  operation: transfer.domestic.edit
  topic: Chuyển tiền
  steps:
  - Nhập người thụ hưởng và số tiền.
  - Kiểm tra nội dung trước khi tiếp tục.
- screenId: term-deposit-create
  operation: deposit.contract.edit
  topic: Tiền gửi có kỳ hạn
  steps:
  - Chọn kỳ hạn và số tiền gửi.
  - Kiểm tra thông tin hợp đồng trước khi tiếp tục.
